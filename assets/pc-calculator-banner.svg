<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="bGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Group 1: Option 2 Tree Icon Badge -->
  <g transform="translate(15, 15)">
    <!-- Icon Container Card -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    
    <!-- Mini Tree Grid -->
    <g opacity="0.4" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2.5 2.5">
      <line x1="50" y1="23" x2="32" y2="43" />
      <line x1="50" y1="23" x2="68" y2="43" />
      <line x1="32" y1="43" x2="20" y2="62" />
      <line x1="32" y1="43" x2="42" y2="62" />
      <line x1="68" y1="43" x2="58" y2="62" />
      <line x1="68" y1="43" x2="80" y2="62" />
    </g>

    <!-- Mini Tree Nodes -->
    <circle cx="50" cy="23" r="5.5" fill="#38BDF8" />
    <circle cx="32" cy="43" r="4.5" fill="#818CF8" />
    <circle cx="68" cy="43" r="4.5" fill="#818CF8" />
    <circle cx="20" cy="62" r="3.5" fill="#C084FC" />
    <circle cx="42" cy="62" r="3.5" fill="#C084FC" />
    <circle cx="58" cy="62" r="3.5" fill="#C084FC" />
    <circle cx="80" cy="62" r="3.5" fill="#C084FC" />

    <!-- Mini Formula Badge -->
    <rect x="16" y="72" width="68" height="18" rx="6" fill="#1E293B" stroke="url(#bGrad2)" stroke-width="1"/>
    <text x="50" y="84" font-family="'Courier New', monospace" font-weight="bold" font-size="9" fill="#38BDF8" text-anchor="middle">nPr • nCr</text>
  </g>

  <!-- Group 2: Brand Typography -->
  <g transform="translate(135, 10)">
    <text x="0" y="62" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="36" fill="#FFFFFF" letter-spacing="-0.5">
      P<tspan fill="url(#bGrad1)">&amp;</tspan>C <tspan font-weight="400" fill="#94A3B8">Calc</tspan>
    </text>
    
    <text x="2" y="88" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="12" fill="#38BDF8" letter-spacing="2">
      PERMUTATIONS &amp; COMBINATIONS
    </text>
  </g>
</svg>
